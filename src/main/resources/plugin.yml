name: ActiveTime
version: 0.1.0
main: com.saiky.activetime.ActiveTime
api-version: '1.20'
author: saiky
description: Your world only progresses while you play. Automatically freezes server simulation when empty.

commands:
  activetime:
    description: Manage and inspect ActiveTime simulation state.
    aliases: [at]
    usage: /<command> [status|freeze|unfreeze|reload]
    permission: activetime.use

permissions:
  activetime.use:
    description: Allows viewing ActiveTime status.
    default: true
  activetime.admin:
    description: Allows manual simulation freezing, unfreezing, and configuration reloading.
    default: op

